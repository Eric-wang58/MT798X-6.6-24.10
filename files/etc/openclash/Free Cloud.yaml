---
mixed-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - "*"
  - "+.lan"
  - "+.local"
  - time.*.com
  - ntp.*.com
  - "+.market.xiaomi.com"
  - geosite:cn
  use-hosts: true
  respect-rules: true
  nameserver-policy:
    geosite:cn,private:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
    - https://223.5.5.5/dns-query#h3=true
    geosite:!cn,!private:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://1.0.0.1/dns-query
    - https://8.8.4.4/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://120.53.53.53/dns-query
  - https://223.5.5.5/dns-query#h3=true
  default-nameserver:
  - https://120.53.53.53/dns-query
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  nameserver:
  - 114.114.114.114
  - 119.28.28.28
  - 223.4.4.4
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 127.0.0.0/8
    domain:
    - "+.google.com"
    - "+.facebook.com"
    - "+.youtube.com"
    - "+.twitter.com"
ntp:
  enable: true
  write-to-system: false
  server: time.windows.com
  port: 123
  interval: 30
proxies:
